name: CD

on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm version
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version from VERSION
        run: |
          RELEASE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo 'VERSION file is empty'
            exit 1
          fi

          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate release metadata
        run: npm run check:release

      - name: Ensure package version does not already exist
        run: |
          RELEASE_VERSION=$(tr -d '[:space:]' < VERSION)
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "Package version already exists in npm: ${PACKAGE_NAME}@${RELEASE_VERSION}"
            exit 1
          fi

          echo "Version is available for publish: ${PACKAGE_NAME}@${RELEASE_VERSION}"

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --access public --provenance